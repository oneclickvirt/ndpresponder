main:
  push: &publish-cnb
    - name: test-build-publish-multiarch-ndpresponder
      services:
        - docker
      docker:
        image: cnbcool/default-build-env
      stages:
        - name: ensure manifest verification runtime
          script: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
        - name: test and vet the synchronized public source
          script: |
            set -eu
            docker run --rm -v "$PWD:/src" -w /src golang:1.26-alpine sh -ec 'go test ./... && go vet ./...'
        - name: publish amd64 and ARM64 images to CNB
          script: bash scripts/publish-cnb.sh
          timeout: 1h
  "crontab: 23 4 * * *": *publish-cnb
  web_trigger_publish_images: *publish-cnb
