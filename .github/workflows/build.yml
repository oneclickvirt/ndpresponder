---
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-compile supported proxy hosts
        run: |
          for target in \
            darwin/amd64 \
            darwin/arm64 \
            dragonfly/amd64 \
            freebsd/amd64 \
            freebsd/arm64 \
            netbsd/amd64 \
            netbsd/arm64 \
            openbsd/amd64 \
            openbsd/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build ./...
            GOOS="$os" GOARCH="$arch" go test -c -o "/tmp/ndpresponder-$os-$arch.test" .
          done
  docker:
    name: Container image (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            tag_suffix: x86
          - platform: linux/arm64
            architecture: arm64
            tag_suffix: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build an OCI image for platform verification
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=/tmp/ndpresponder-${{ matrix.architecture }}.tar
      - name: Verify OCI platform metadata
        shell: bash
        env:
          ARCHIVE: /tmp/ndpresponder-${{ matrix.architecture }}.tar
          EXPECTED_OS: linux
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile

          archive = os.environ["ARCHIVE"]
          expected_os = os.environ["EXPECTED_OS"]
          expected_architecture = os.environ["EXPECTED_ARCHITECTURE"]
          manifest_media_type = "application/vnd.oci.image.manifest.v1+json"
          index_media_type = "application/vnd.oci.image.index.v1+json"
          config_media_type = "application/vnd.oci.image.config.v1+json"

          with tarfile.open(archive) as layout:
              def read_json(path):
                  member = layout.extractfile(path)
                  if member is None:
                      raise RuntimeError(f"OCI layout does not contain {path}")
                  return json.load(member)

              def read_descriptor(descriptor, expected_media_types):
                  if not isinstance(descriptor, dict):
                      raise RuntimeError(f"invalid OCI descriptor type: {type(descriptor).__name__}")
                  media_type = descriptor.get("mediaType", "")
                  if media_type not in expected_media_types:
                      raise RuntimeError(f"unexpected OCI descriptor media type: {media_type!r}")
                  digest = descriptor.get("digest", "")
                  if not isinstance(digest, str) or len(digest) != 71 or not digest.startswith("sha256:") or any(c not in "0123456789abcdef" for c in digest[7:]):
                      raise RuntimeError(f"invalid OCI descriptor digest: {digest!r}")
                  size = descriptor.get("size")
                  if not isinstance(size, int) or size <= 0:
                      raise RuntimeError(f"invalid OCI descriptor size: {size!r}")
                  path = f"blobs/sha256/{digest.removeprefix('sha256:')}"
                  try:
                      member = layout.getmember(path)
                  except KeyError as error:
                      raise RuntimeError(f"OCI layout does not contain {path}") from error
                  if member.size != size:
                      raise RuntimeError(f"OCI descriptor size mismatch for {path}: {member.size}, expected {size}")
                  stream = layout.extractfile(member)
                  if stream is None:
                      raise RuntimeError(f"OCI layout cannot read {path}")
                  payload = stream.read()
                  if hashlib.sha256(payload).hexdigest() != digest.removeprefix('sha256:'):
                      raise RuntimeError(f"OCI descriptor digest mismatch for {path}")
                  try:
                      return json.loads(payload)
                  except json.JSONDecodeError as error:
                      raise RuntimeError(f"OCI descriptor {path} is not JSON") from error

              def find_manifest(index):
                  if not isinstance(index, dict) or index.get("schemaVersion") != 2:
                      raise RuntimeError("invalid OCI image index")
                  for descriptor in index.get("manifests", []):
                      if not isinstance(descriptor, dict):
                          raise RuntimeError("invalid OCI image index manifest descriptor")
                      media_type = descriptor.get("mediaType", "")
                      platform = descriptor.get("platform", {})
                      if media_type == manifest_media_type:
                          if platform.get("os") == expected_os and platform.get("architecture") == expected_architecture:
                              return descriptor
                      elif media_type == index_media_type:
                          manifest = find_manifest(read_descriptor(descriptor, {index_media_type}))
                          if manifest is not None:
                              return manifest
                  return None

              manifest = find_manifest(read_json("index.json"))
              if manifest is None:
                  raise RuntimeError(f"OCI layout has no {expected_os}/{expected_architecture} image manifest")
              image_manifest = read_descriptor(manifest, {manifest_media_type})
              if image_manifest.get("schemaVersion") != 2:
                  raise RuntimeError("invalid OCI image manifest")
              config = read_descriptor(image_manifest.get("config"), {config_media_type})
              if config.get("os") != expected_os or config.get("architecture") != expected_architecture:
                  raise RuntimeError(f"OCI config platform is {config.get('os')}/{config.get('architecture')}, expected {expected_os}/{expected_architecture}")
          PY
      - name: Log in to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: spiritlhl
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Publish verified platform image
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: spiritlhl/ndpresponder_${{ matrix.tag_suffix }}:latest
          push: true
