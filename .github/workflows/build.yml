---
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-compile supported proxy hosts
        run: |
          for target in \
            darwin/amd64 \
            darwin/arm64 \
            dragonfly/amd64 \
            freebsd/amd64 \
            freebsd/arm64 \
            netbsd/amd64 \
            netbsd/arm64 \
            openbsd/amd64 \
            openbsd/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build ./...
            GOOS="$os" GOARCH="$arch" go test -c -o "/tmp/ndpresponder-$os-$arch.test" .
          done
  docker:
    name: Container image (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            tag_suffix: x86
          - platform: linux/arm64
            architecture: arm64
            tag_suffix: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build an OCI image for platform verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=/tmp/ndpresponder-${{ matrix.architecture }}.tar
      - name: Verify OCI platform metadata
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ndpresponder-${{ matrix.architecture }}.tar
          index_digest=$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest')
          manifest_path="blobs/sha256/${index_digest#sha256:}"
          config_digest=$(tar -xOf "$archive" "$manifest_path" | jq -r '.config.digest')
          config_path="blobs/sha256/${config_digest#sha256:}"
          actual_os=$(tar -xOf "$archive" "$config_path" | jq -r '.os')
          actual_architecture=$(tar -xOf "$archive" "$config_path" | jq -r '.architecture')
          test "$actual_os" = linux
          test "$actual_architecture" = "${{ matrix.architecture }}"
      - name: Log in to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: spiritlhl
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Publish verified platform image
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: spiritlhl/ndpresponder_${{ matrix.tag_suffix }}:latest
          push: true
